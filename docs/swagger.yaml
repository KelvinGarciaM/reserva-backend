basePath: /api/v1
definitions:
  handlers.UpdateTarifaRequest:
    properties:
      descripcion:
        type: string
      fechaFin:
        type: string
      fechaInicio:
        type: string
      idTipoHabitacion:
        type: integer
      nombreTarifa:
        type: string
      precioBase:
        type: number
    type: object
  handlers.clienteCedulaRequest:
    properties:
      cedula:
        type: string
    required:
    - cedula
    type: object
  handlers.createDetalleReservaRequest:
    properties:
      cantidadPersonas:
        type: integer
      fechaEntrada:
        type: string
      fechaSalida:
        type: string
      idHabitacion:
        type: integer
      idReserva:
        type: integer
    required:
    - fechaEntrada
    - fechaSalida
    - idHabitacion
    - idReserva
    type: object
  handlers.createRecepcionistaRequest:
    properties:
      apellidos:
        type: string
      cedula:
        type: string
      correo:
        type: string
      nombre:
        type: string
      telefono:
        type: string
    required:
    - apellidos
    - cedula
    - correo
    - nombre
    - telefono
    type: object
  handlers.createTarifaRequest:
    properties:
      descripcion:
        type: string
      estado:
        type: integer
      fechaFin:
        type: string
      fechaInicio:
        type: string
      idTipoHabitacion:
        type: integer
      nombreTarifa:
        type: string
      precioBase:
        type: number
    required:
    - idTipoHabitacion
    - nombreTarifa
    - precioBase
    type: object
  handlers.createTipoClienteRequest:
    properties:
      descripcion:
        type: string
      descuentoBase:
        type: number
      nombreTipoC:
        type: string
    required:
    - nombreTipoC
    type: object
  handlers.deleteTipoClienteRequest:
    properties:
      idTipoCliente:
        type: integer
    required:
    - idTipoCliente
    type: object
  handlers.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  handlers.loginResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/handlers.loginUser'
    type: object
  handlers.loginUser:
    properties:
      email:
        type: string
      id:
        type: integer
      image:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  handlers.recepcionistaCedulaRequest:
    properties:
      cedula:
        type: string
    required:
    - cedula
    type: object
  handlers.registerClienteRequest:
    properties:
      apellidos:
        type: string
      cedula:
        type: string
      direccion:
        type: string
      idTipoCliente:
        type: integer
      nombre:
        type: string
      telefono:
        type: string
    required:
    - apellidos
    - cedula
    - direccion
    - idTipoCliente
    - nombre
    - telefono
    type: object
  handlers.registerHabitacionRequest:
    properties:
      idTipoHab:
        type: integer
      numeroHabitacion:
        type: string
    required:
    - idTipoHab
    - numeroHabitacion
    type: object
  handlers.registerRequest:
    properties:
      cedula:
        type: string
      email:
        type: string
      image:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    required:
    - email
    - name
    - password
    type: object
  handlers.registerReservaRequest:
    properties:
      estadoReserva:
        type: string
      fechaReserva:
        type: string
      idCliente:
        type: string
      idRecepcionista:
        type: string
      iva:
        type: number
      subTotal:
        type: number
      total:
        type: number
    required:
    - estadoReserva
    - fechaReserva
    - idCliente
    - idRecepcionista
    type: object
  handlers.registerTipoHabitacionRequest:
    properties:
      capacidadMax:
        type: integer
      descripcion:
        type: string
      nombreTipoHab:
        type: string
    required:
    - capacidadMax
    - descripcion
    - nombreTipoHab
    type: object
  handlers.tarifaResponse:
    properties:
      desactivadaManual:
        type: integer
      descripcion:
        type: string
      estado:
        type: string
      fechafin:
        type: string
      fechainicio:
        type: string
      idtarifa:
        type: integer
      nombretarifa:
        type: string
      preciobase:
        type: number
      tipohabitacion:
        type: string
    type: object
  handlers.tipoClienteIdRequest:
    properties:
      idTipoCliente:
        type: integer
    required:
    - idTipoCliente
    type: object
  handlers.updateClienteRequest:
    properties:
      apellidos:
        type: string
      cedula:
        type: string
      direccion:
        type: string
      estado:
        type: integer
      idTipoCliente:
        type: integer
      nombre:
        type: string
      telefono:
        type: string
    required:
    - apellidos
    - cedula
    - direccion
    - idTipoCliente
    - nombre
    - telefono
    type: object
  handlers.updateDetalleReservaRequest:
    properties:
      cantidadPersonas:
        type: integer
      fechaEntrada:
        type: string
      fechaSalida:
        type: string
      idHabitacion:
        type: integer
    required:
    - cantidadPersonas
    - idHabitacion
    type: object
  handlers.updateEstadoReservaRequest:
    properties:
      estadoReserva:
        type: string
    required:
    - estadoReserva
    type: object
  handlers.updateHabitacionRequest:
    properties:
      estado:
        type: integer
      idTipoHab:
        type: integer
      numeroHabitacion:
        type: string
    required:
    - idTipoHab
    - numeroHabitacion
    type: object
  handlers.updateRecepcionistaRequest:
    properties:
      apellidos:
        type: string
      cedula:
        type: string
      correo:
        type: string
      estado:
        type: integer
      nombre:
        type: string
      telefono:
        type: string
    required:
    - apellidos
    - cedula
    - correo
    - nombre
    - telefono
    type: object
  handlers.updateRequest:
    properties:
      cedula:
        type: string
      email:
        type: string
      estado:
        type: integer
      image:
        type: string
      name:
        type: string
      password:
        type: string
      role:
        type: string
    type: object
  handlers.updateReservaRequest:
    properties:
      estado:
        type: integer
      estadoReserva:
        type: string
      fechaReserva:
        type: string
      idCliente:
        type: string
      idRecepcionista:
        type: string
      iva:
        type: number
      subTotal:
        type: number
      total:
        type: number
    required:
    - estadoReserva
    - fechaReserva
    - idCliente
    - idRecepcionista
    type: object
  handlers.updateTipoClienteRequest:
    properties:
      descripcion:
        type: string
      descuentoBase:
        type: number
      estado:
        type: integer
      idTipoCliente:
        type: integer
      nombreTipoC:
        type: string
    required:
    - idTipoCliente
    - nombreTipoC
    type: object
  handlers.updateTipoHabitacionRequest:
    properties:
      capacidadMax:
        type: integer
      descripcion:
        type: string
      estado:
        type: integer
      nombreTipoHab:
        type: string
    required:
    - capacidadMax
    - descripcion
    - nombreTipoHab
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para sistema de reservas de hotel
  title: API de Reservas
  version: "1.0"
paths:
  /clientes:
    delete:
      consumes:
      - application/json
      description: Desactiva un cliente en el sistema
      parameters:
      - description: Cédula del cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.clienteCedulaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Desactivar cliente (soft delete)
      tags:
      - clientes
    get:
      description: Devuelve la lista completa de clientes (activos e inactivos)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener todos los clientes
      tags:
      - clientes
    post:
      consumes:
      - application/json
      description: Registra un nuevo cliente en el sistema
      parameters:
      - description: Datos del cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.registerClienteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear cliente
      tags:
      - clientes
    put:
      consumes:
      - application/json
      description: Actualiza los datos de un cliente existente
      parameters:
      - description: Datos a actualizar
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.updateClienteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar cliente
      tags:
      - clientes
  /clientes/{cedula}:
    get:
      description: Busca un cliente por su número de cédula
      parameters:
      - description: Cédula del cliente
        in: path
        name: cedula
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener cliente por cédula
      tags:
      - clientes
  /clientes/buscar:
    get:
      description: Busca clientes por nombre, apellidos, cédula o teléfono
      parameters:
      - description: Término de búsqueda
        in: query
        name: q
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Buscar clientes
      tags:
      - clientes
  /clientes/tipo/{idtipocliente}:
    get:
      description: Busca clientes por ID de tipo de cliente
      parameters:
      - description: ID del tipo de cliente
        in: path
        name: idtipocliente
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener clientes por tipo
      tags:
      - clientes
  /clientes/toggle:
    put:
      consumes:
      - application/json
      description: Cambia el estado de un cliente (activo/inactivo)
      parameters:
      - description: Cédula del cliente
        in: body
        name: cliente
        required: true
        schema:
          $ref: '#/definitions/handlers.clienteCedulaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Activar/Desactivar cliente
      tags:
      - clientes
  /detalles-reserva:
    get:
      description: Obtiene todos los detalles de reserva, activos e inactivos
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener detalles de reserva
      tags:
      - detalles-reserva
    post:
      consumes:
      - application/json
      description: Agrega una habitación a una reserva y calcula tarifa, descuento,
        subtotal, IVA y total
      parameters:
      - description: Datos del detalle
        in: body
        name: datos
        required: true
        schema:
          $ref: '#/definitions/handlers.createDetalleReservaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Crear detalle de reserva
      tags:
      - detalles-reserva
  /detalles-reserva/{idDetalleReserva}:
    delete:
      description: Alterna el estado lógico del detalle entre activo e inactivo
      parameters:
      - description: ID del detalle
        in: path
        name: idDetalleReserva
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Activar o desactivar detalle de reserva
      tags:
      - detalles-reserva
    get:
      description: Obtiene un detalle de reserva específico
      parameters:
      - description: ID del detalle
        in: path
        name: idDetalleReserva
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener detalle de reserva por ID
      tags:
      - detalles-reserva
    patch:
      consumes:
      - application/json
      description: Actualiza habitación, cantidad de personas y opcionalmente las
        fechas del detalle
      parameters:
      - description: ID del detalle
        in: path
        name: idDetalleReserva
        required: true
        type: integer
      - description: Datos actualizados
        in: body
        name: datos
        required: true
        schema:
          $ref: '#/definitions/handlers.updateDetalleReservaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Actualizar detalle de reserva
      tags:
      - detalles-reserva
  /detalles-reserva/habitacion/{idHabitacion}/fechas-ocupadas:
    get:
      description: Obtiene los rangos de fechas ocupados por detalles activos
      parameters:
      - description: ID de la habitación
        in: path
        name: idHabitacion
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties:
                type: string
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener fechas ocupadas de una habitación
      tags:
      - detalles-reserva
  /detalles-reserva/habitacion/{idHabitacion}/tarifa:
    get:
      description: Obtiene la tarifa activa correspondiente a una habitación para
        una fecha determinada
      parameters:
      - description: ID de la habitación
        in: path
        name: idHabitacion
        required: true
        type: integer
      - description: Fecha en formato YYYY-MM-DD
        in: query
        name: fecha
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener tarifa por habitación y fecha
      tags:
      - detalles-reserva
  /detalles-reserva/reserva/{idReserva}:
    get:
      description: Obtiene los detalles activos pertenecientes a una reserva
      parameters:
      - description: ID de la reserva
        in: path
        name: idReserva
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Obtener detalles por reserva
      tags:
      - detalles-reserva
  /habitaciones:
    get:
      description: Devuelve la lista completa de habitaciones
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obtener todas las habitaciones
      tags:
      - habitaciones
    post:
      consumes:
      - application/json
      description: Registra una nueva habitación en el sistema
      parameters:
      - description: Datos de la habitación
        in: body
        name: habitacion
        required: true
        schema:
          $ref: '#/definitions/handlers.registerHabitacionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Crear habitación
      tags:
      - habitaciones
  /habitaciones/{id}:
    delete:
      description: Cambia el estado de la habitación en vez de borrarla físicamente
      parameters:
      - description: ID de la habitación
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
